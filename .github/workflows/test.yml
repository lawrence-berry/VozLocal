name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terminal:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: zsh terminal/tests/run.zsh

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test
        working-directory: bot
      - run: node --test
        working-directory: chrome

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: chrome/bin/dev bundle exec rspec

name = "vozlocal-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
GRAPH_VERSION = "v26.0"

# From `npx wrangler d1 create vozlocal`. To run your own copy, create a database and replace this id.
[[d1_databases]]
binding = "DB"
database_name = "vozlocal"
database_id = "6428e28f-05eb-41bf-aab0-bac92040f428"
migrations_dir = "migrations"

# Secrets, set with `npx wrangler secret put <NAME>` (locally: .dev.vars, see .dev.vars.example):
# ALLOWED_NUMBERS, APP_SECRET, VERIFY_TOKEN, WHATSAPP_TOKEN, PHONE_NUMBER_ID, SYNC_TOKEN
